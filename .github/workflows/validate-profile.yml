name: Validate profile assets

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/validate_profile_assets.py
      - .github/workflows/validate-profile.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/validate_profile_assets.py
      - .github/workflows/validate-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_profile_assets.py
